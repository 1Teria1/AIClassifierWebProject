<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support Classifier</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --border: rgba(226, 232, 240, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(249, 115, 22, 0.05) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .support-card {
            max-width: 1000px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: cardFade 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-gradient {
            background: linear-gradient(135deg, #1A2A6C 0%, #b21f1f 50%, #fdbb4d 100%);
            background-size: 200% 200%;
            animation: gradientMove 8s ease infinite;
            padding: 1.5rem 2rem;
            color: white;
            text-align: center;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header-gradient h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; }
        .header-gradient p { font-weight: 300; opacity: 0.9; font-size: 0.9rem; }

        .main-content { padding: 1.5rem; }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 16px 65px 16px 20px;
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 24px;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transform: translateY(-2px);
        }

        .submit-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: #000;
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .submit-btn:hover { background: #222; transform: translateY(-50%) scale(1.05); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: translateY(-50%); }

        /* Стили для кнопок-примеров */
        .examples-section {
            margin-bottom: 25px;
        }

        .examples-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .examples-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .example-btn {
            background: white;
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .example-btn:hover {
            background: #000;
            color: white;
            border-color: #000;
            transform: translateY(-1px);
        }

        .example-btn:active {
            transform: translateY(1px);
        }

        .example-icon {
            font-size: 1rem;
        }

        .result-box {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 1.5rem;
            display: none;
            animation: resultSlide 0.5s ease-out forwards;
        }

        @keyframes resultSlide {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .label { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px; }
        .value { font-size: 1.3rem; font-weight: 700; color: var(--text-main); }
        .confidence { font-size: 0.85rem; color: #22c55e; margin-top: 5px; }

        .track {
            height: 12px;
            background: linear-gradient(to right, #22c55e, #eab308, #f97316, #ef4444);
            border-radius: 20px;
            position: relative;
            margin-top: 10px;
        }
        .thumb {
            width: 28px;
            height: 28px;
            background: #000;
            border: 5px solid #fff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 0%;
            transform: translate(-50%, -50%);
            transition: left 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .marks { display: flex; justify-content: space-between; margin-top: 15px; font-size: 0.7rem; font-weight: 700; color: var(--text-secondary); }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .chart-box {
            background: white;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .chart-box h4 {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-secondary);
            text-align: center;
        }

        canvas {
            max-height: 200px;
            width: 100%;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 16px;
            padding: 15px;
            color: #dc2626;
            text-align: center;
            margin-top: 15px;
        }

        @media (max-width: 700px) {
            .charts-container { grid-template-columns: 1fr; }
            .res-grid { grid-template-columns: 1fr; }
            .main-content { padding: 1rem; }
            .examples-grid { gap: 8px; }
            .example-btn { padding: 6px 12px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<div class="support-card">
    <div class="header-gradient">
        <h1>🤖 AI Support Classifier</h1>
        <p>Автоматическая классификация обращений в службу поддержки</p>
    </div>

    <div class="main-content">
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Опишите проблему или задайте вопрос..." autocomplete="off">
            <button class="submit-btn" id="sendBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </div>

        <!-- Кнопки-примеры по категориям -->
        <div class="examples-section">
            <div class="examples-title">📋 Примеры обращений</div>
            <div class="examples-grid">
                <button class="example-btn" data-category="payment">
                    <span class="example-icon">💳</span> Оплата
                </button>
                <button class="example-btn" data-category="delivery">
                    <span class="example-icon">📦</span> Доставка
                </button>
                <button class="example-btn" data-category="technical">
                    <span class="example-icon">⚙️</span> Техническая проблема
                </button>
                <button class="example-btn" data-category="product">
                    <span class="example-icon">🏷️</span> Вопрос по товару
                </button>
                <button class="example-btn" data-category="spam">
                    <span class="example-icon">🚫</span> Спам
                </button>
            </div>
        </div>

        <div class="result-box" id="resultArea">
            <div class="res-grid">
                <div>
                    <div class="label">📂 Категория запроса</div>
                    <div class="value" id="catText">—</div>
                    <div class="confidence" id="catConfidence">—</div>
                </div>
                <div style="text-align: right;">
                    <div class="label">⚡ Уровень приоритета</div>
                    <div class="value" id="prioText">—</div>
                    <div class="confidence" id="prioConfidence">—</div>
                </div>
            </div>

            <div class="label" style="text-align: center; margin-bottom: 10px;">📊 Шкала срочности</div>
            <div class="track">
                <div class="thumb" id="thumb"></div>
            </div>
            <div class="marks">
                <span>Низкий</span>
                <span>Средний</span>
                <span>Высокий</span>
                <span>Критический</span>
            </div>

            <div class="charts-container">
                <div class="chart-box">
                    <h4>📊 Распределение вероятностей по категориям</h4>
                    <canvas id="categoryChart"></canvas>
                </div>
                <div class="chart-box">
                    <h4>🎯 Распределение вероятностей по приоритетам</h4>
                    <canvas id="priorityChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // API URL — замените на адрес вашего сервера
    const API_URL = "/predict";

    // Названия категорий и приоритетов
    const categoryNames = ["Оплата", "Доставка", "Техническая проблема", "Вопрос по товару", "Спам / Не по теме"];
    const priorityNames = ["Низкий", "Средний", "Высокий", "Критический"];

    // Примеры текстов для каждой категории
    const exampleTexts = {
        payment: [
            "Не могу оплатить заказ, карта не проходит",
            "Деньги списались, а товар не пришел",
            "Платеж завис, что делать?"
        ],
        delivery: [
            "Где моя посылка? Третий день без обновлений",
            "Курьер не приехал, жду уже 2 часа",
            "Заказ потерялся, помогите найти"
        ],
        technical: [
            "Сайт не грузится, выдает ошибку 500",
            "Приложение вылетает при открытии",
            "Не могу войти в личный кабинет"
        ],
        product: [
            "Как вернуть товар, если не подошел размер?",
            "Есть ли гарантия на телефон?",
            "Можно ли обменять товар на другой цвет?"
        ],
        spam: [
            "Выиграли iPhone! Перейдите по ссылке",
            "Нужны деньги? Лучшие кредиты здесь"
        ]
    };

    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');
    const resultArea = document.getElementById('resultArea');
    const thumb = document.getElementById('thumb');

    let categoryChart = null;
    let priorityChart = null;

    // Функция для получения случайного примера из категории
    function getRandomExample(category) {
        const examples = exampleTexts[category];
        if (!examples || examples.length === 0) return "";
        return examples[Math.floor(Math.random() * examples.length)];
    }

    // Функция для установки текста примера и отправки запроса
    function setExampleAndSend(category) {
        const exampleText = getRandomExample(category);
        if (exampleText) {
            input.value = exampleText;
            sendRequest();
        }
    }

    function initCharts() {
        const ctxCat = document.getElementById('categoryChart').getContext('2d');
        const ctxPrio = document.getElementById('priorityChart').getContext('2d');

        categoryChart = new Chart(ctxCat, {
            type: 'bar',
            data: {
                labels: categoryNames,
                datasets: [{
                    label: 'Вероятность',
                    data: [0, 0, 0, 0, 0],
                    backgroundColor: 'rgba(59, 130, 246, 0.7)',
                    borderRadius: 8,
                    borderSkipped: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: (ctx) => `${(ctx.raw * 100).toFixed(1)}%` } }
                },
                scales: {
                    y: { beginAtZero: true, max: 1, ticks: { callback: (v) => `${(v * 100).toFixed(0)}%` } }
                }
            }
        });

        priorityChart = new Chart(ctxPrio, {
            type: 'bar',
            data: {
                labels: priorityNames,
                datasets: [{
                    label: 'Вероятность',
                    data: [0, 0, 0, 0],
                    backgroundColor: 'rgba(249, 115, 22, 0.7)',
                    borderRadius: 8,
                    borderSkipped: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: (ctx) => `${(ctx.raw * 100).toFixed(1)}%` } }
                },
                scales: {
                    y: { beginAtZero: true, max: 1, ticks: { callback: (v) => `${(v * 100).toFixed(0)}%` } }
                }
            }
        });
    }

    async function sendRequest() {
        const text = input.value.trim();
        if (!text) {
            alert("Введите текст обращения или выберите пример");
            return;
        }

        btn.disabled = true;
        resultArea.style.display = 'block';
        resultArea.innerHTML = '<div class="loading">🔄 Анализируем обращение...</div>';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const data = await response.json();
            displayResult(data);

        } catch (error) {
            console.error("Ошибка:", error);
            resultArea.innerHTML = `<div class="error-message">❌ Ошибка подключения к серверу: ${error.message}<br>Убедитесь, что API запущен по адресу ${API_URL}</div>`;
        } finally {
            btn.disabled = false;
        }
    }

    function displayResult(data) {
        // Восстанавливаем структуру resultArea
        resultArea.innerHTML = `
            <div class="res-grid">
                <div>
                    <div class="label">📂 Категория запроса</div>
                    <div class="value" id="catText">—</div>
                    <div class="confidence" id="catConfidence">—</div>
                </div>
                <div style="text-align: right;">
                    <div class="label">⚡ Уровень приоритета</div>
                    <div class="value" id="prioText">—</div>
                    <div class="confidence" id="prioConfidence">—</div>
                </div>
            </div>
            <div class="label" style="text-align: center; margin-bottom: 10px;">📊 Шкала срочности</div>
            <div class="track">
                <div class="thumb" id="thumb"></div>
            </div>
            <div class="marks">
                <span>Низкий</span>
                <span>Средний</span>
                <span>Высокий</span>
                <span>Критический</span>
            </div>
            <div class="charts-container">
                <div class="chart-box">
                    <h4>📊 Распределение вероятностей по категориям</h4>
                    <canvas id="categoryChart"></canvas>
                </div>
                <div class="chart-box">
                    <h4>🎯 Распределение вероятностей по приоритетам</h4>
                    <canvas id="priorityChart"></canvas>
                </div>
            </div>
        `;

        // Заполняем данные
        document.getElementById('catText').innerText = data.category_ru || categoryNames[data.category] || "Неизвестно";
        document.getElementById('prioText').innerText = data.priority_ru || priorityNames[data.priority] || "Неизвестно";

        const catConf = (data.category_confidence * 100).toFixed(1);
        const prioConf = (data.priority_confidence * 100).toFixed(1);
        document.getElementById('catConfidence').innerHTML = `🎯 Уверенность: ${catConf}%`;
        document.getElementById('prioConfidence').innerHTML = `🎯 Уверенность: ${prioConf}%`;

        // Обновляем слайдер
        const priorityIdx = data.priority;
        const pos = (priorityIdx / 3) * 100;
        const newThumb = document.getElementById('thumb');
        newThumb.style.left = pos + '%';

        // Создаём графики
        const ctxCat = document.getElementById('categoryChart').getContext('2d');
        const ctxPrio = document.getElementById('priorityChart').getContext('2d');

        if (categoryChart) {
            categoryChart.destroy();
            priorityChart.destroy();
        }

        const categoryPreds = data.category_preds || [0, 0, 0, 0, 0];
        const priorityPreds = data.priority_preds || [0, 0, 0, 0];

        categoryChart = new Chart(ctxCat, {
            type: 'bar',
            data: {
                labels: categoryNames,
                datasets: [{
                    label: 'Вероятность',
                    data: categoryPreds,
                    backgroundColor: 'rgba(59, 130, 246, 0.7)',
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => `${(ctx.raw * 100).toFixed(1)}%` } } },
                scales: { y: { beginAtZero: true, max: 1, ticks: { callback: (v) => `${(v * 100).toFixed(0)}%` } } }
            }
        });

        priorityChart = new Chart(ctxPrio, {
            type: 'bar',
            data: {
                labels: priorityNames,
                datasets: [{
                    label: 'Вероятность',
                    data: priorityPreds,
                    backgroundColor: 'rgba(249, 115, 22, 0.7)',
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => `${(ctx.raw * 100).toFixed(1)}%` } } },
                scales: { y: { beginAtZero: true, max: 1, ticks: { callback: (v) => `${(v * 100).toFixed(0)}%` } } }
            }
        });
    }

    // Инициализация
    initCharts();

    // Обработчики событий
    btn.addEventListener('click', sendRequest);
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendRequest(); });

    // Обработчики для кнопок-примеров
    document.querySelectorAll('.example-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const category = btn.getAttribute('data-category');
            setExampleAndSend(category);
        });
    });
</script>

</body>
</html>
